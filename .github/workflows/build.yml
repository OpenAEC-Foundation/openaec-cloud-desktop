name: Build OpenAEC Storage

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

# Release aanmaken en installers eraan hangen.
permissions:
  contents: write

jobs:
  # Desktop-app: Windows (.exe/.msi, met WebView2-bootstrapper en WebView2Loader.dll) en Linux (.deb/.AppImage).
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: windows
            bundels: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-22.04
            naam: linux
            bundels: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Systeembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: npm install
      # Bij een v*-tag: conceptrelease met de installers; anders als workflow-artefact.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "OpenAEC Storage ${{ github.ref_name }}"
          releaseDraft: true
      - name: Installers als artefact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: openaec-storage-${{ matrix.naam }}
          path: ${{ matrix.bundels }}
          if-no-files-found: error

  # Opdrachtregelprogramma (ook voor Linux-servers zonder scherm).
  cli:
    needs: app   # bij een tag bestaat de release dan al
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            naam: linux-x86_64
            bestand: crates/openaec-sync/target/release/openaec-storage
          - os: windows-latest
            naam: windows-x86_64
            bestand: crates/openaec-sync/target/release/openaec-storage.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/openaec-sync
      - name: Tests
        working-directory: crates/openaec-sync
        run: cargo test
      - name: Bouwen
        working-directory: crates/openaec-sync
        run: cargo build --release --features cli --bin openaec-storage
      - uses: actions/upload-artifact@v4
        with:
          name: openaec-storage-cli-${{ matrix.naam }}
          path: ${{ matrix.bestand }}
          if-no-files-found: error
      - name: Aan de release toevoegen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp "${{ matrix.bestand }}" "openaec-storage-${{ matrix.naam }}${{ runner.os == 'Windows' && '.exe' || '' }}"
          gh release upload "${{ github.ref_name }}" "openaec-storage-${{ matrix.naam }}"* --clobber
