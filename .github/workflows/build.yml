name: Build OpenAEC Desktop App

on:
  workflow_dispatch: {}
  push:
    tags: ["v*"]

# Release aanmaken en installers eraan hangen.
permissions:
  contents: write

jobs:
  # Desktop-app: Windows (.exe/.msi, met WebView2-bootstrapper en WebView2Loader.dll), Linux (.deb/.AppImage) en macOS
  # (.dmg, universeel voor Apple silicon en Intel). Op Windows ondertekend met Azure Trusted Signing, op macOS met het
  # Developer ID-certificaat en genotariseerd met een App Store Connect API-sleutel (geheimen van de organisatie), net
  # als de andere OpenAEC-apps.
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            naam: windows
            # tauri.verkenner.conf.json: de DLL's en pakketten van het moderne rechtermuismenu in de installers.
            args: --config src-tauri/tauri.signing.conf.json --config src-tauri/tauri.verkenner.conf.json
            bundels: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.sig
          - os: ubuntu-22.04
            naam: linux
            args: ""
            bundels: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/deb/*.sig
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.sig
          # Eén universele app (arm64 en x64); in latest.json staat hij voor darwin-aarch64 en darwin-x86_64.
          - os: macos-latest
            naam: macos
            args: --target universal-apple-darwin
            bundels: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
              src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22: `npm test` draait de TypeScript-tests rechtstreeks met node --test.
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Windows: ook ARM64 voor de DLL van het rechtermuismenu (de Verkenner laadt alleen zijn eigen architectuur).
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || runner.os == 'Windows' && 'x86_64-pc-windows-msvc,aarch64-pc-windows-msvc' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            crates/openaec-sync
            crates/openaec-shellmenu
      - name: Systeembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - run: npm install

      # De tests van de app op de platforms die niet lokaal getest worden (o.a. het rechtermuismenu, en op macOS dat
      # alles zonder de Windows-code bouwt). De frontend moet er zijn voor generate_context.
      - name: Tests van de app (Linux en macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      # Notarisatie met een App Store Connect API-sleutel: Tauri wil het pad naar het .p8-bestand.
      - name: API-sleutel voor notarisatie (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$RUNNER_TEMP/apple-api-key.p8"

      # De opdrachtregel voor Windows wordt hier gebouwd, zodat de signeeractie hem ondertekent en daarbij signtool
      # en de Trusted Signing-bibliotheek op de runner zet (die heeft de signCommand hieronder nodig).
      - name: Opdrachtregel bouwen (Windows)
        if: runner.os == 'Windows'
        working-directory: crates/openaec-sync
        run: cargo build --release --features cli --bin openaec-storage
      # Het moderne rechtermuismenu van Windows 11 (crates/openaec-shellmenu): de DLL voor x64 en ARM64, met de
      # unit-tests en de rooktest (CoCreateInstance met een test-CLSID). Ondertekenen en verpakken gebeurt verderop.
      - name: Verkenner-menu bouwen en testen (Windows)
        if: runner.os == 'Windows'
        working-directory: crates/openaec-shellmenu
        shell: pwsh
        run: |
          cargo test --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build --target x86_64-pc-windows-msvc --lib --examples
          cargo run --target x86_64-pc-windows-msvc --example rooktest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build --release --target x86_64-pc-windows-msvc --lib
          cargo build --release --target aarch64-pc-windows-msvc --lib
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $doel = '../../src-tauri/shellmenu'
          foreach ($arch in @(@('x64', 'x86_64'), @('arm64', 'aarch64'))) {
            New-Item -ItemType Directory -Force "$doel/$($arch[0])" | Out-Null
            Copy-Item "target/$($arch[1])-pc-windows-msvc/release/openaec_shellmenu.dll" "$doel/$($arch[0])/"
          }
          Copy-Item ../../src-tauri/icons/128x128.png "$doel/logo.png"
      - name: Opdrachtregel ondertekenen en signeergereedschap installeren (Windows)
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@v1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          cache-dependencies: false
          files-folder: ${{ github.workspace }}/crates/openaec-sync/target/release
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Tauri ondertekent zelf elk Windows-bestand zodra bundle.windows.signCommand gezet is: de app (nadat de
      # bundler hem heeft aangepast), de NSIS-onderdelen, de uninstaller en de installers. Deze config bestaat
      # alleen in de bouwstraat en wijst naar het gereedschap van de stap hierboven.
      - name: Signeeropdracht voor Tauri (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_ENDPOINT: ${{ secrets.AZURE_ENDPOINT }}
          AZURE_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: |
          # De actie installeert in ArtifactSigning (nieuwere versies) of TrustedSigning (oudere).
          $mappen = @('ArtifactSigning', 'TrustedSigning') | ForEach-Object { Join-Path $env:LOCALAPPDATA $_ } | Where-Object { Test-Path $_ }
          $signtool = $mappen | ForEach-Object { Get-ChildItem $_ -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue } |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          $dlib = $mappen | ForEach-Object { Get-ChildItem $_ -Recurse -Filter '*CodeSigning.Dlib.dll' -ErrorAction SilentlyContinue } |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $signtool -or -not $dlib) { Write-Error "signtool of de Trusted Signing-bibliotheek niet gevonden in: $mappen"; exit 1 }
          $metadata = Join-Path $env:RUNNER_TEMP 'trusted-signing-metadata.json'
          @{
            Endpoint = $env:AZURE_ENDPOINT
            CodeSigningAccountName = $env:AZURE_ACCOUNT
            CertificateProfileName = $env:AZURE_PROFILE
          } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
          $conf = @{ bundle = @{ windows = @{ signCommand = @{
            cmd = $signtool.FullName
            args = @('sign', '/v', '/fd', 'SHA256', '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
                     '/dlib', $dlib.FullName, '/dmdf', $metadata, '%1')
          } } } }
          $conf | ConvertTo-Json -Depth 10 | Set-Content -Path src-tauri/tauri.signing.conf.json -Encoding utf8
          # Ook voor de stap Verkenner-menu ondertekenen.
          "SIGNTOOL=$($signtool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNTOOL_METADATA=$metadata" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "signtool: $($signtool.FullName)"
          Write-Output "dlib:     $($dlib.FullName)"

      # Het pakket met identiteit voor het moderne rechtermuismenu (sparse package: alleen het manifest en het logo; de
      # DLL staat in de installatiemap). De uitgever in het manifest moet precies het onderwerp van het certificaat
      # zijn, anders weigert signtool het pakket: daarom komt hij uit de handtekening van de opdrachtregel. Eerst de
      # DLL's ondertekenen, dan de pakketten maken en ondertekenen; Tauri neemt ze als resources mee in NSIS en MSI.
      - name: Verkenner-menu ondertekenen en verpakken (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          function Teken([string[]] $bestanden) {
            & $env:SIGNTOOL sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 `
              /dlib $env:SIGNTOOL_DLIB /dmdf $env:SIGNTOOL_METADATA @bestanden
            if ($LASTEXITCODE -ne 0) { Write-Error "ondertekenen mislukt: $bestanden"; exit 1 }
          }
          $map = (Resolve-Path src-tauri/shellmenu).Path
          Teken @((Get-ChildItem $map -Recurse -Filter openaec_shellmenu.dll).FullName)
          $uitgever = (Get-AuthenticodeSignature crates/openaec-sync/target/release/openaec-storage.exe).SignerCertificate.Subject
          if (-not $uitgever) { Write-Error 'geen onderwerp van het certificaat gevonden'; exit 1 }
          Write-Output "uitgever: $uitgever"
          $versie = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } | Select-Object -Last 1
          if (-not $makeappx) { Write-Error 'makeappx.exe niet gevonden'; exit 1 }
          $pakketten = @()
          foreach ($arch in 'x64', 'arm64') {
            $bron = Join-Path $env:RUNNER_TEMP "pakket-$arch"
            New-Item -ItemType Directory -Force "$bron/shellmenu" | Out-Null
            Copy-Item "$map/logo.png" "$bron/shellmenu/logo.png"
            cargo run --release --manifest-path crates/openaec-shellmenu/Cargo.toml --target x86_64-pc-windows-msvc --example manifest -- `
              --versie $versie --arch $arch --uitgever $uitgever --uit "$bron/AppxManifest.xml"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $msix = Join-Path $map "OpenAEC-Verkenner-$arch.msix"
            # /nv: de app en de DLL waar het manifest naar wijst, staan niet in het pakket maar in de installatiemap.
            & $makeappx.FullName pack /d $bron /p $msix /nv /o
            if ($LASTEXITCODE -ne 0) { Write-Error "makeappx mislukt ($arch)"; exit 1 }
            $pakketten += $msix
          }
          Teken $pakketten
          Get-ChildItem $map -Recurse -File | ForEach-Object { Write-Output $_.FullName }

      # Bij een v*-tag: conceptrelease met de installers; anders als workflow-artefact.
      # Automatische updates: met de updater-sleutel krijgt elke installer (en de AppImage en de .app.tar.gz) een .sig,
      # en bij een tag komt latest.json aan de release (alle platforms samengevoegd), waar de app naar kijkt.
      # Op macOS zet tauri-action het certificaat in een tijdelijke sleutelhanger, ondertekent en notariseert.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_PATH: ${{ runner.os == 'macOS' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "OpenAEC Desktop App ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: true
          # De Windows-installer in latest.json is de NSIS-setup (zoals in de README), niet de .msi.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # Geen ongetekende of niet-genotariseerde Mac-app in een release: controleer de app zoals hij in de .dmg zit.
      - name: Handtekening en notarisatie controleren (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)"
          test -n "$dmg"
          koppel="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$koppel" "$dmg"
          app="$(find "$koppel" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app"
          mkdir -p "$RUNNER_TEMP/controle"
          cp -R "$app" "$RUNNER_TEMP/controle/"
          hdiutil detach "$koppel"
          app="$RUNNER_TEMP/controle/$(basename "$app")"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          # Universeel: Apple silicon en Intel in één programma.
          programma="$(find "$app/Contents/MacOS" -type f -perm -u+x -print -quit)"
          lipo -archs "$programma" | tee /dev/stderr | grep -q arm64
          lipo -archs "$programma" | grep -q x86_64

      # Geen ongetekende Windows-bestanden in een release: elke handtekening moet geldig zijn.
      - name: Handtekeningen controleren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Tauri ondertekent de app zoals hij in de installer gaat, niet het bestand in target/release; daarom ook de
          # uitgepakte inhoud van de NSIS-installer nakijken (de WebView2-bestanden dragen de handtekening van Microsoft).
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $inhoud = Join-Path $env:RUNNER_TEMP 'nsis-inhoud'
          7z x -y "-o$inhoud" $setup.FullName | Out-Null
          $binnen = @(Get-ChildItem $inhoud -Recurse -Include *.exe, *.dll, *.msix -ErrorAction SilentlyContinue)
          if (-not ($binnen | Where-Object { $_.Name -match '^(openaec-cloud|OpenAEC Storage|OpenAEC Desktop App)\.exe$' })) {
            Write-Error "de app zit niet in de installer: $($binnen.Name -join ', ')"; exit 1
          }
          # Het moderne rechtermuismenu: de DLL voor x64 en ARM64 en de twee pakketten, in de installer en in de MSI
          # (uitgepakt met een administratieve installatie, zonder iets te installeren).
          $msi = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          $msiInhoud = Join-Path $env:RUNNER_TEMP 'msi-inhoud'
          Start-Process msiexec.exe -Wait -ArgumentList @('/a', "`"$($msi.FullName)`"", '/qn', "TARGETDIR=`"$msiInhoud`"")
          $menu = @(Get-ChildItem $msiInhoud -Recurse -Include openaec_shellmenu.dll, *.msix -ErrorAction SilentlyContinue)
          $nodig = 'x64/openaec_shellmenu.dll', 'arm64/openaec_shellmenu.dll', 'shellmenu/OpenAEC-Verkenner-x64.msix', 'shellmenu/OpenAEC-Verkenner-arm64.msix'
          foreach ($set in @(@{ naam = 'installer'; bestanden = $binnen }, @{ naam = 'MSI'; bestanden = $menu })) {
            $namen = @($set.bestanden | ForEach-Object { "$($_.Directory.Name)/$($_.Name)" })
            foreach ($n in $nodig) {
              if ($namen -notcontains $n) { Write-Error "$n ontbreekt in de $($set.naam): $($namen -join ', ')"; exit 1 }
            }
          }
          $binnen += $menu
          $bestanden = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/bundle/msi/*.msi,
            crates/openaec-sync/target/release/openaec-storage.exe -ErrorAction SilentlyContinue) + $binnen
          if ($bestanden.Count -lt 4) { Write-Error "niet alle Windows-bestanden gevonden: $($bestanden.Name -join ', ')"; exit 1 }
          $fout = $false
          foreach ($b in $bestanden) {
            $h = Get-AuthenticodeSignature $b.FullName
            Write-Output ("{0}: {1} ({2})" -f $b.Name, $h.Status, $h.SignerCertificate.Subject)
            if ($h.Status -ne 'Valid') { $fout = $true }
          }
          if ($fout) { Write-Error 'niet elk bestand heeft een geldige handtekening'; exit 1 }

      - name: Installers als artefact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: openaec-desktop-app-${{ matrix.naam }}
          path: ${{ matrix.bundels }}
          if-no-files-found: error
      - name: Opdrachtregel als artefact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: openaec-storage-cli-windows-x86_64
          path: crates/openaec-sync/target/release/openaec-storage.exe
          if-no-files-found: error
      - name: Opdrachtregel aan de release toevoegen (Windows)
        if: runner.os == 'Windows' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp crates/openaec-sync/target/release/openaec-storage.exe openaec-storage-windows-x86_64.exe
          gh release upload "${{ github.ref_name }}" openaec-storage-windows-x86_64.exe --clobber

  # Tests van de sync-motor op alle platforms, en de opdrachtregel voor Linux (ook voor servers zonder scherm).
  # De Windows-opdrachtregel komt uit de app-job, ondertekend; op macOS alleen de tests.
  cli:
    needs: app   # bij een tag bestaat de release dan al
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            naam: linux-x86_64
            bestand: crates/openaec-sync/target/release/openaec-storage
          - os: windows-latest
            naam: windows-x86_64
            bestand: crates/openaec-sync/target/release/openaec-storage.exe
          - os: macos-latest
            naam: macos
            bestand: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: crates/openaec-sync
      - name: Tests
        working-directory: crates/openaec-sync
        run: cargo test
      - name: Bouwen
        if: runner.os == 'Linux'
        working-directory: crates/openaec-sync
        run: cargo build --release --features cli --bin openaec-storage
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: openaec-storage-cli-${{ matrix.naam }}
          path: ${{ matrix.bestand }}
          if-no-files-found: error
      - name: Aan de release toevoegen
        if: runner.os == 'Linux' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cp "${{ matrix.bestand }}" "openaec-storage-${{ matrix.naam }}"
          gh release upload "${{ github.ref_name }}" "openaec-storage-${{ matrix.naam }}" --clobber
