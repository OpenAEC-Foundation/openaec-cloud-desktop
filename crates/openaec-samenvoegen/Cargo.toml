[package]
name = "openaec-samenvoegen"
version = "2026.45.1"
edition = "2021"
description = "Twee versies van een IFC-bestand vergelijken en gelijktijdige wijzigingen samenvoegen (three-way merge) per object"
license = "AGPL-3.0-only"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Alleen voor het opdrachtregelprogramma (feature "cli").
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
# Property-based tests (tests/eigenschappen.rs).
proptest = { version = "1", default-features = false, features = ["std"] }

[features]
cli = ["dep:clap"]

[[bin]]
name = "openaec-samenvoegen"
path = "src/bin/openaec-samenvoegen.rs"
required-features = ["cli"]

[profile.release]
debug = 1
