[package]
name = "openaec-sync"
version = "0.1.0"
edition = "2021"
description = "Kern van de OpenAEC Storage-sync: API-client, blokhashes en delta-upload/-download"
license = "AGPL-3.0-only"

[dependencies]
blake3 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
