[package]
name = "openaec-sync"
version = "0.7.0"
edition = "2021"
description = "Kern van de OpenAEC Storage-sync: API-client, blokhashes en delta-upload/-download"
license = "AGPL-3.0-only"

[dependencies]
blake3 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "macros", "time", "sync", "signal"] }
# Alleen voor het opdrachtregelprogramma (feature "cli").
clap = { version = "4", features = ["derive"], optional = true }
dirs = { version = "5", optional = true }
notify = { version = "6", optional = true }

[features]
cli = ["dep:clap", "dep:dirs", "dep:notify"]

[[bin]]
name = "openaec-storage"
path = "src/bin/openaec-storage.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
