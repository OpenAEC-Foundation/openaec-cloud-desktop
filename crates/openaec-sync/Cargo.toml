[package]
name = "openaec-sync"
version = "2026.44.10"
edition = "2021"
description = "Kern van de OpenAEC Storage-sync: API-client, blokhashes en delta-upload/-download"
license = "AGPL-3.0-only"

[dependencies]
blake3 = "1"
log = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "http2", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
thiserror = "2"
# IFC-bestanden samenvoegen bij gelijktijdig werk (ontwerp §5.6).
openaec-samenvoegen = { path = "../openaec-samenvoegen" }
tokio = { version = "1", features = ["fs", "io-util", "net", "rt-multi-thread", "macros", "time", "sync", "signal"] }
# Een map versturen: als zip zonder compressie (overdracht.rs); geen extra compressiebibliotheken nodig.
zip = { version = "4", default-features = false }
# Alleen voor het opdrachtregelprogramma (feature "cli").
clap = { version = "4", features = ["derive"], optional = true }
dirs = { version = "5", optional = true }
notify = { version = "6", optional = true }

# Veilig vervangen (vervang.rs): plaatsen zonder te vervangen en zien of een proces een bestand open heeft.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_RestartManager"] }

[features]
cli = ["dep:clap", "dep:dirs", "dep:notify"]

[[bin]]
name = "openaec-storage"
path = "src/bin/openaec-storage.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
