[package]
name = "openaec-cloud"
version = "2026.44.4"
description = "OpenAEC Desktop App — sync-client en tools-overzicht"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openaec_cloud_lib"
# Alleen rlib: dit is een desktop-only app. staticlib/cdylib zijn mobiele
# artefacten (Android .so / iOS static) en de cdylib faalt op de windows-gnu
# toolchain met "export ordinal too large" (te grote export-tabel). main.rs
# linkt gewoon tegen de rlib — er is geen aparte DLL nodig.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
dirs = "5"
notify = "6"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
openaec-sync = { path = "../crates/openaec-sync" }
# De logica van het moderne rechtermuismenu (menu.json, pakketnaam); de COM-server zelf is een aparte DLL.
openaec-shellmenu = { path = "../crates/openaec-shellmenu", default-features = false }
anyhow = "1"
# Tools-tabblad: downloads streamen en controleren tegen de SHA-256 van GitHub.
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
log = "0.4"
env_logger = "0.11"

# Windows Cloud Filter API (Verkenner-overlays + files-on-demand) — Fase 2.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Eigen kolommen in de Verkenner (StorageProviderItemProperties::SetAsync wil een IIterable).
windows-collections = "0.2"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_CloudFilters",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  # CfConvertToPlaceholder, CfSetPinState en CfRevertPlaceholder (OVERLAPPED-parameter).
  "Win32_System_IO",
  # Gekoppelde mappen bij de shell registreren (StorageProviderSyncRootManager), zodat de
  # Verkenner de statusvinkjes toont; de id bevat de SID van de gebruiker.
  "Storage",
  "Storage_Provider",
  "Storage_Search",
  # StorageFile (eigen kolommen op een bestand zetten).
  "Storage_Streams",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  # CfConnectSyncRoot/CfExecute + CF_CALLBACK_INFO/CF_OPERATION_INFO bevatten
  # een CORRELATION_VECTOR-veld; zonder deze feature bestaan die items niet.
  "Win32_System_CorrelationVector",
  # Tools-tabblad: installers via de shell starten (UAC volgens het manifest) en hun Authenticode-handtekening
  # controleren.
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography",
  # Het pakket voor het moderne rechtermuismenu registreren (PackageManager) en de architectuur van Windows bepalen.
  "ApplicationModel",
  "Foundation",
  "Management_Deployment",
  "Win32_System_SystemInformation",
] }

# Tests: de updater vergelijkt versies met semver (jaar.week moet nieuwer zijn dan de oude 0.x-versies), en
# Versturen draait tegen een nagebootste server (versturen.rs).
[dev-dependencies]
semver = "1"
wiremock = "0.6"
